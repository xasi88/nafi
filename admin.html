<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<title>NAFI: вещи и цены</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Prata&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/admin.css">
<script>
  (() => {
    const d = document.documentElement, m = matchMedia('(prefers-color-scheme: dark)'), q = new URLSearchParams(location.search).get('tema');
    const tema = () => { d.dataset.tema = q === 'tma' || q === 'svet' ? q : (m.matches ? 'tma' : 'svet'); };
    tema(); m.addEventListener('change', tema);
  })();
</script>
</head>
<body class="adm">
<header class="adm-shapka">
  <a href="./" aria-label="Открыть сайт"><img src="img/znak.png" alt="NAFI" width="484" height="375"></a>
  <div>
    <h1>Вещи и цены</h1>
    <p class="adm-status" data-status>Загрузка…</p>
  </div>
</header>

<section class="dostup" data-dostup hidden>
  <h2>Подключить сохранение</h2>
  <p>Ключ GitHub вводится один раз на этом телефоне. Он даёт право менять только этот сайт.</p>
  <label class="pole">Ключ GitHub<input type="password" autocomplete="off" spellcheck="false" data-klyuch></label>
  <button class="knopka" type="button" data-podklyuchit>Подключить</button>
  <p class="adm-oshibka" data-dostup-oshibka role="alert"></p>
</section>

<main class="adm-spisok" data-spisok></main>

<p class="adm-novoe">Новую вещь добавляет Хаси: пришлите ему фото, название, возраст и цену.</p>

<div class="adm-niz">
  <span data-izmeneno>Изменений нет</span>
  <button class="knopka-vtor" type="button" data-otmena hidden>Отменить</button>
  <button class="knopka" type="button" data-sohranit disabled>Сохранить</button>
</div>
<div class="tost" data-tost role="status" aria-live="polite"></div>

<script type="module" src="js/admin.js"></script>
</body>
</html>
